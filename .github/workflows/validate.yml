name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest JSON
        run: |
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json \
                   plugins/groundwork/.claude-plugin/plugin.json \
                   plugins/groundwork/.codex-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      - name: Check Groundwork shared-skill / adapter boundary
        run: python3 scripts/check-adapter-boundary.py

      - name: Check the script boundary rule itself fires
        run: python3 scripts/check-adapter-boundary.py --self-test

      - name: Check the transcript harvester
        run: python3 plugins/groundwork/scripts/harvest-transcripts --self-test

      - name: Reject workflow prose in a plugin script
        run: |
          set -e
          mkdir -p plugins/groundwork/scripts
          fixture=plugins/groundwork/scripts/ci-boundary-fixture.py
          printf '# Apply the engineering discipline while converging.\n' > "$fixture"
          if python3 scripts/check-adapter-boundary.py; then
            rm -f "$fixture"
            echo "FAIL: the check passed on a script carrying workflow prose"
            exit 1
          fi
          rm -f "$fixture"
          echo "ok: workflow prose in a plugin script is rejected"
